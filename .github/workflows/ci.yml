name: CI & Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-debian:
    name: Build & Package (Ubuntu/Debian)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            gcc \
            make \
            dpkg-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libjson-glib-dev \
            libgee-0.8-dev \
            desktop-file-utils \
            appstream

      - name: Validate desktop file
        run: |
          desktop-file-validate data/io.github.edpmath.Daemonette.desktop

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --no-net data/io.github.edpmath.Daemonette.metainfo.xml

      - name: Build project
        run: |
          make build

      - name: Run unit tests
        run: |
          make test

      - name: Verify application version
        run: |
          ./build/daemonette --version

      - name: Build .deb package
        run: |
          make deb

      - name: Build universal .tar.gz archive
        run: |
          make tarball

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemonette-ubuntu-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Upload .tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemonette-universal-tarball
          path: build/*.tar.gz
          if-no-files-found: error

  build-fedora-rpm:
    name: Build & Package (Fedora/RPM)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            meson \
            ninja-build \
            vala \
            gcc \
            tar \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            json-glib-devel \
            libgee-devel \
            rpm-build \
            desktop-file-utils \
            libappstream-glib

      - name: Validate desktop file
        run: |
          desktop-file-validate data/io.github.edpmath.Daemonette.desktop

      - name: Build project with Meson
        run: |
          meson setup build --prefix=/usr
          ninja -C build

      - name: Run unit tests
        run: |
          meson test -C build --verbose

      - name: Build RPM package
        run: |
          VERSION="$(bash scripts/version.sh)"
          echo "==> Building RPM for daemonette ${VERSION}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --exclude='./build' --exclude='./.git' -czf "~/rpmbuild/SOURCES/daemonette-${VERSION}.tar.gz" --transform "s,^\.,daemonette-${VERSION}," .
          cp packaging/rpm/daemonette.spec ~/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${VERSION}/" ~/rpmbuild/SPECS/daemonette.spec
          rpmbuild -ba ~/rpmbuild/SPECS/daemonette.spec
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemonette-fedora-rpm
          path: dist/*.rpm
          if-no-files-found: error

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-debian, build-fedora-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.deb
            release-assets/**/*.tar.gz
            release-assets/**/*.rpm
          generate_release_notes: true
